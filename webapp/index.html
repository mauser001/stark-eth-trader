<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trader Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="login-overlay" class="overlay">
        <form id="login-form" class="login-box">
            <h1>Trader Dashboard</h1>
            <p>Enter the password to continue.</p>
            <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Unlock</button>
            <p id="login-error" class="error"></p>
        </form>
    </div>

    <div id="dashboard" class="hidden">
        <header>
            <h1>Trader Dashboard</h1>
            <div class="header-right">
                <span id="last-updated" class="muted"></span>
                <button id="notify-btn" class="btn-small">Enable alerts</button>
            </div>
        </header>

        <section class="cards">
            <div class="card">
                <div class="card-label">ETH Balance</div>
                <div class="card-value" id="balance-eth">-</div>
            </div>
            <div class="card">
                <div class="card-label">STRK Balance</div>
                <div class="card-value" id="balance-strk">-</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Balances over time</h2>
                <div class="range-buttons" id="range-buttons">
                    <button data-range="week">Last week</button>
                    <button data-range="month">Last month</button>
                    <button data-range="all" class="active">All time</button>
                </div>
            </div>
            <canvas id="chart-balances" height="90"></canvas>
        </section>

        <section class="panel">
            <h2>Matched trades per day</h2>
            <canvas id="chart-daily" height="90"></canvas>
        </section>

        <section class="panel">
            <h2>Last 100 trades</h2>
            <div class="table-wrap">
                <table id="trades-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Direction</th>
                            <th>Sell</th>
                            <th>Buy</th>
                            <th>Fee (STRK)</th>
                            <th>Status</th>
                            <th>Net ETH</th>
                        </tr>
                    </thead>
                    <tbody id="trades-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="js/chart.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
